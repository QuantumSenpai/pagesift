name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pagesift_test
          POSTGRES_PASSWORD: pagesift_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pagesift_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify comment-free authored files
        run: npm run check:no-comments

      - name: Verify formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Run strict type check
        run: npm run typecheck

      - name: Build production distribution
        run: npm run build

      - name: Validate Chrome extension package
        run: npm run validate:extension

      - name: Install Playwright Chromium for extension E2E
        run: npx playwright install --with-deps chromium

      - name: Run unit, backend, and Chromium extension E2E tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://pagesift_test:pagesift_test_password@127.0.0.1:5432/postgres
        run: xvfb-run -a npm test

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=low

      - name: Run HTTP smoke test on built server
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://pagesift_test:pagesift_test_password@127.0.0.1:5432/postgres
        run: npm run smoke

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagesift-extension
          path: dist/pagesift-extension.zip
          retention-days: 30

  release:
    name: Create Release with Extension Artifact
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: pagesift-extension
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PageSift v${{ github.run_number }}
          body: |
            ## PageSift Extension v${{ github.run_number }}
            
            **Manifest V3** • **16+ Local Tools** • **Zero Dependencies** • **Optional BYOK AI**
            
            ### 🚀 Quick Install
            1. Download `pagesift-extension.zip` below
            2. Extract the archive
            3. Open `chrome://extensions` → Enable **Developer mode** → **Load unpacked** → Select extracted folder
            
            ### ✨ What's Inside
            - **Inspect & Measure** — Element inspection, CSS box metrics, distance measurement
            - **Extract & Export** — Clone Page, Clone Prompt, Design MD, Assets (ZIP)
            - **Capture & Viewports** — Full-page screenshots, multi-viewport responsive stage, synced popup windows
            - **Live Preview & Audit** — Edit Text, Swap Font, Arrange, Design Review (WCAG), Tech Stack detection
            - **Motion Lab (v1.2.0)** — Reverse-engineer animations: inspect declared CSS/WAAPI, record interactive sessions, replay in isolated preview, compare reference vs reconstruction, import/export Reanimate ZIP/JSON, **simplified 3-tab export** (MOTION.md, AI Prompt, HTML Demo) for AI recreation
            - **Activity History** — Auto-logged per-site runs in IndexedDB with filterable timeline
            
            ### 📦 Assets
            - `pagesift-extension.zip` — Ready-to-load Manifest V3 extension (~920 KB)
            
            ---
            Built from commit ${{ github.sha }}
          files: dist/pagesift-extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
